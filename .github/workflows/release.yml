name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        id: installer
        shell: pwsh
        run: ./windows/installer/build.ps1
      - name: Check tag version
        shell: pwsh
        run: |
          if ('v' + '${{ steps.installer.outputs.version }}' -ne '${{ github.ref_name }}') {
            throw "Release tag '${{ github.ref_name }}' does not match Windows version v${{ steps.installer.outputs.version }}."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: TapDrop-Setup-${{ steps.installer.outputs.version }}
          path: ${{ steps.installer.outputs.installer }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew :app:assembleDebug
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk "android/app/build/outputs/apk/debug/TapDrop-Android-${{ github.ref_name }}-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: TapDrop-Android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/debug/TapDrop-Android-${{ github.ref_name }}-debug.apk

  release:
    runs-on: ubuntu-latest
    needs:
      - windows
      - android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/**/*.exe
            artifacts/**/*.apk
          generate_release_notes: true
