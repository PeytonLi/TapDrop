name: CI

on:
  push:
  pull_request:

jobs:
  relay:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  dotnet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: dotnet test windows/TapDrop.sln --configuration Release
      - run: npm ci
        working-directory: relay
      - run: bash scripts/e2e.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: bash scripts/e2e-android.sh

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && ./gradlew :app:testDebugUnitTest :app:assembleDebug lint
      - uses: actions/upload-artifact@v4
        with:
          name: TapDrop-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  windows-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet publish windows/TapDrop.Tray -c Release -r win-x64 --self-contained -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: TapDrop-Windows
          path: windows/TapDrop.Tray/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish/
